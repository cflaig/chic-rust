<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chic Chess - WebAssembly</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        #container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        #loading {
            text-align: center;
            color: #ecf0f1;
            font-size: 18px;
        }

        .error {
            color: #e74c3c;
            padding: 20px;
            background: #fadbd8;
            border-radius: 5px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Chic Chess</h1>
        <div id="loading">Loading chess engine...</div>
        <canvas id="chic_canvas" width="800" height="850"></canvas>
    </div>

    <script type="module">
        import init from './pkg/chic.js';

        async function run() {
            try {
                // Hide loading message
                document.getElementById('loading').style.display = 'none';

                // Initialize the WASM module
                await init();

                console.log('Chic Chess loaded successfully!');
            } catch (e) {
                console.error('Failed to load Chic Chess:', e);
                document.getElementById('loading').innerHTML =
                    '<div class="error">Failed to load chess engine: ' + e + '</div>';
            }
        }

        run();
    </script>
</body>
</html>
