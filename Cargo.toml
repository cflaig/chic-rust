[workspace]
members = ["chic-lib", "chic-engine", "chic-ui"]
resolver = "2"

[workspace.package]
name = "chic"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
clap = { version = "4.5.31", features = ["cargo"] }
lazy_static = "1.5.0"
rand = "0.9.0"
rand_pcg = "0.9.0"
tabled = "0.18.0"

[workspace.target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1.1.0"